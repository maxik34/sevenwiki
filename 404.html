<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark only">
<meta name="robots" content="noindex, nofollow">
<title>Seven Wiki</title>
<link rel="icon" href="data:," sizes="any">
<link rel="icon" href="/sevenwiki/icon.svg" type="image/svg+xml">
<script>
(function()
{
	const path = window.location.pathname;
	const base = '/sevenwiki/';
	const baseIndex = path.toLowerCase().indexOf(base.toLowerCase());

	if (baseIndex !== -1)
	{
		const prefix = path.substring(0, baseIndex + base.length);
		const tail = path.substring(baseIndex + base.length);

		try
		{
			let decodedTail = decodeURIComponent(tail);
			const cleanedTail = decodedTail.toLowerCase().replace(/[\s,]+/g, '-');

			if (cleanedTail !== tail)
			{
				const suffix = window.location.search + window.location.hash;

				window.location.replace(prefix + cleanedTail + suffix);
				return;
			}
		}
		catch (e)
		{
			console.error("URL normalization failed:", e);
		}
	}
})();
</script>
</head>
<body>
<div style="text-align:center">
<h1>404</h1>
<p>Page not found</p>
<p><a href="/sevenwiki/en/main-page">Go to Main Page</a></p>
</div>
</body>
</html>
